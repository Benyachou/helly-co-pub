<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Helly-Co Services — le film</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: "Archivo"; src: url("fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Cormorant"; src: url("fonts/cormorant-normal-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Cormorant"; src: url("fonts/cormorant-normal-600.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Cormorant"; src: url("fonts/cormorant-italic-500.woff2") format("woff2"); font-weight: 500; font-style: italic; }
:root { --vert: #A5CD39; --creme: #EDE6D6; --or: #E9D7A6; --barre: 131px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
#stage { font-variant-numeric: lining-nums; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; color: #fff; font-family: "Archivo", Arial, sans-serif; }
.scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; background: #000; }

/* L'image, en format cinémascope entre deux bandes noires */
.ecran { position: absolute; left: 0; right: 0; top: var(--barre); bottom: var(--barre); overflow: hidden; background: #07080A; }
.ecran.plein { top: 0; bottom: 0; }
.plan { position: absolute; inset: 0; will-change: transform, opacity; }
.plan > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.08) saturate(.88); }
.moitie { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
.moitie.g { left: 0; } .moitie.d { right: 0; }
.moitie > img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.08) saturate(.88); }
.etalonnage { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(8, 40, 52, .35), rgba(0,0,0,0) 45%, rgba(60, 30, 0, .28)); mix-blend-mode: soft-light; }
.ombre { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.15) 55%, rgba(0,0,0,0) 100%); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

/* Textes */
.st { position: absolute; left: 0; right: 0; bottom: 0; height: var(--barre); display: flex; align-items: center; justify-content: center;
  font: italic 500 52px/1 "Cormorant", Georgia, serif; color: var(--creme); opacity: 0; }
.mot { position: absolute; left: 110px; bottom: 70px; font-weight: 900; font-size: 210px; letter-spacing: -0.04em; line-height: .92; }
.mot.moyen { font-size: 140px; }
.l { display: block; overflow: hidden; padding-bottom: .08em; }
.l > span { display: block; }
.serif { font-family: "Cormorant", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
.chapitre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chapitre .num { font: italic 500 46px "Cormorant", Georgia, serif; color: var(--or); opacity: 0; }
.chapitre .nom { margin-top: 10px; font: 600 150px/1 "Cormorant", Georgia, serif; color: var(--creme); opacity: 0; }
.chapitre .trait { margin-top: 34px; height: 2px; width: 420px; background: var(--or); transform: scaleX(0); }

/* Amorce de pellicule */
#s-amorce { background: #262626; }
.cible { position: absolute; left: 50%; top: 50%; width: 720px; height: 720px; margin: -360px 0 0 -360px; border-radius: 50%; }
.cible .balai { position: absolute; inset: 0; border-radius: 50%; }
.cible .rond { position: absolute; inset: 0; border: 6px solid #d8d8d8; border-radius: 50%; }
.cible .rond.in { inset: 60px; border-width: 4px; }
.croix { position: absolute; background: #d8d8d8; }
.croix.h { left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; }
.croix.v { top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; }
.chiffre { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 420px/1 "Cormorant", Georgia, serif; color: #f2f2f2; }
.rayure { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.35); }

/* Lune */
.silhouette img { position: absolute; inset: 0; width: 100%; }
.presente { position: absolute; left: 140px; bottom: 210px; font: italic 500 64px "Cormorant", Georgia, serif; color: var(--creme); opacity: 0; }
.titre-film { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.titre-film h1 { font: 600 190px/1 "Cormorant", Georgia, serif; letter-spacing: .01em;
  background: linear-gradient(100deg, #d9cfb4 35%, #ffffff 50%, #d9cfb4 65%); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.titre-film p { margin-top: 40px; font: italic 500 48px "Cormorant", Georgia, serif; color: #b9b2a2; opacity: 0; }

/* Carte des trajets */
.lieu { font: italic 500 40px "Cormorant", Georgia, serif; fill: var(--creme); }

/* Logos partenaires */
.plaques { position: absolute; left: 110px; top: 50px; display: flex; gap: 18px; }
.plaques span { display: flex; align-items: center; height: 84px; padding: 0 24px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.plaques img { height: 46px; } .plaques .ria img { height: 52px; }
.mur { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
.mur .rangee { display: flex; gap: 46px; }
.mur .rangee span { flex: 1; height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.6); opacity: 0; }
.mur .rangee img { max-width: 78%; max-height: 52%; }
.mur .serif { font-size: 70px; color: var(--creme); margin-bottom: 56px; opacity: 0; }

/* Bulles */
.bulle { position: absolute; padding: 16px 32px 22px; border-radius: 26px; background: #fff; color: #1E1F22;
  font: 46px/1.2 "Segoe UI", Tahoma, Arial, sans-serif; direction: rtl; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.35); opacity: 0; }
.bulle::after { content: ""; position: absolute; bottom: -14px; width: 30px; height: 30px; background: #fff; transform: rotate(45deg); }
.bulle.g::after { left: 60px; } .bulle.d::after { right: 60px; }

/* Langues, entracte, générique */
.centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.langue { font: 600 150px/1.15 "Cormorant", Georgia, serif; color: var(--creme); }
.langue.ar { font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-weight: 600; color: var(--vert); }
.petit { margin-top: 40px; font: italic 500 46px "Cormorant", Georgia, serif; color: #b9b2a2; }
.entracte { font: 600 160px/1 "Cormorant", Georgia, serif; color: var(--or); }
.horaires { margin-top: 56px; font-size: 46px; line-height: 1.35; color: var(--creme); }
.horaires span { display: block; font-size: 30px; color: #9a9384; margin-top: 26px; }
.defile { position: absolute; left: 0; right: 0; top: 0; text-align: center; will-change: transform; }
.defile .role { font: italic 500 36px "Cormorant", Georgia, serif; color: #9a9384; margin-top: 70px; }
.defile .nom { font: 600 56px/1.2 "Cormorant", Georgia, serif; color: var(--creme); margin-top: 8px; padding: 0 260px; }
.defile .gros-titre { font: 600 130px/1 "Cormorant", Georgia, serif; color: var(--creme); }
.defile .logos-gen { display: flex; gap: 26px; justify-content: center; margin-top: 18px; }
.defile .logos-gen span { background: #fff; border-radius: 10px; padding: 14px 22px; display: flex; align-items: center; }
.defile .logos-gen img { height: 42px; }
.defile .mark-gen { position: relative; width: 200px; height: 230px; margin: 0 auto; }
.defile .mark-gen img, .fin .mark img { position: absolute; inset: 0; width: 100%; }
.fin .mark { position: relative; width: 240px; height: 276px; }
.fin .mot-logo { width: 360px; margin-top: 22px; }

/* Effets globaux */
#fuite { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .09; mix-blend-mode: overlay; image-rendering: pixelated; }
#coin { position: absolute; right: 70px; top: 38px; display: flex; gap: 12px; align-items: center; opacity: .8; }
#coin .m { position: relative; width: 46px; height: 53px; }
#coin .m img { position: absolute; inset: 0; width: 100%; }
#coin > img { height: 40px; }
.vhs { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, rgba(0,0,0,0) 2px 5px); }
.vhs-txt { position: absolute; left: 70px; top: 40px; font: 700 44px "Archivo", monospace; color: #fff; letter-spacing: .06em; opacity: 0; text-shadow: 3px 0 rgba(255,0,60,.6), -3px 0 rgba(0,200,255,.6); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="fuite"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="coin"><div class="m"><img src="assets/mark-vert.png" alt=""><img src="assets/mark-blanc.png" alt=""></div><img src="assets/texte-sur-fonce.png" alt=""></div>
</div>

<script>
// ————————————————————————————————————————————————————————————————
// « Un seul comptoir », un film en quatre chapitres. La liste ci-dessous
// décrit chaque scène ; le moteur, plus bas, fabrique et anime le tout.
// ————————————————————————————————————————————————————————————————
const P = n => `assets/photos/hd/${n}.jpg`;
const LISTE = [
  { type: 'amorce', dur: 6 },
  { type: 'lune', dur: 12, texte: 'Helly-Co Services présente' },
  { type: 'titre', dur: 9, titre: 'Un seul comptoir', sous: 'Réparation, transfert d’argent, démarches, bureautique.' },

  { type: 'chapitre', dur: 5, num: 'Chapitre premier', nom: 'La chute' },
  { type: 'chute', dur: 16 },
  { type: 'rembobine', dur: 11 },
  { type: 'photo', dur: 15, plans: [['tournevis', 0, 'in'], ['carte-mere', 5, 'gauche'], ['iphone-charge', 10, 'out']],
    mots: [['Écran.', 0.6, 3.6], ['Batterie.', 3.8, 6.8], ['Prise de charge.', 7.0, 10.6], ['Caméra.', 10.8, 15]],
    st: [['Dans notre atelier, ici, en boutique.', 1.0, 14.5]] },
  { type: 'photo', dur: 12, plans: [['main-tel', 0, 'in'], ['homme-tel', 6, 'droite']], moyen: true,
    mots: [['Écran noir ?', 0.6, 3.8], ['Batterie à plat ?', 4.0, 7.6], ['Plus de son ?', 7.8, 12]],
    st: [['Un téléphone qui ne marche plus, c’est toute la journée qui s’arrête.', 1.0, 11.5]] },
  { type: 'photo', dur: 8, plans: [['toutes-marques', 0, 'out']], moyen: true, mots: [['Toutes les marques.', 0.8, 8]],
    st: [['Quel que soit votre téléphone, on regarde avec vous.', 1.2, 7.6]] },
  { type: 'photo', dur: 9, plans: [['iphones', 0, 'in']], serif: true, mots: [['Réparé.', 0.8, 9]],
    st: [['Réparation de téléphone, chez Helly-Co.', 1.6, 8.6]] },

  { type: 'chapitre', dur: 5, num: 'Chapitre deux', nom: 'La distance' },
  { type: 'trajets', dur: 15, st: [['Votre famille est loin.', 0.8, 6.8], ['Votre argent, lui, fait le voyage.', 7.2, 14.5]] },
  { type: 'photo', dur: 10, plans: [['famille-musulmane', 0, 'in']], st: [['Là-bas, quelqu’un compte sur vous.', 1.0, 9.6]] },
  { type: 'envoi', dur: 12, st: [['Au Maroc et partout dans le monde.', 6.6, 11.6]] },
  { type: 'logos', dur: 9, titre: 'Transfert d’argent avec', st: [['En espèces ou par carte, en toute sécurité.', 2.6, 8.6]] },
  { type: 'photo', dur: 8, plans: [['appel-homme', 0, 'gauche']], plaques: 0.6, moyen: true, mots: [['Envoyé ici.<br>Reçu là-bas.', 0.8, 8]],
    st: [['Western Union, MoneyGram, Ria.', 3.0, 7.6]] },
  { type: 'entracte', dur: 12 },

  { type: 'chapitre', dur: 5, num: 'Chapitre trois', nom: 'Le dossier' },
  { type: 'papiers', dur: 13, st: [['Les papiers vous dépassent ?', 0.8, 7.2], ['On les remet en ordre, avec vous.', 8.4, 12.6]] },
  { type: 'conseil', dur: 13, st: [['On vous explique tout, pas à pas.', 1.0, 6.4], ['En français, en arabe et en anglais.', 6.8, 12.6]] },
  { type: 'photo', dur: 10, plans: [['formulaire', 0, 'in'], ['signature', 5, 'droite']], mots: [['Rempli.', 0.8, 4.8], ['Signé.', 5.4, 10]],
    st: [['Préfecture, consulats, rendez-vous, formulaires.', 1.2, 9.6]] },
  { type: 'photo', dur: 9, plans: [['deux-hommes-documents', 0, 'droite']], moyen: true, mots: [['Pas à pas.', 0.8, 9]],
    st: [['Démarches administratives.', 1.4, 8.6]] },
  { type: 'langues', dur: 9 },

  { type: 'chapitre', dur: 5, num: 'Chapitre quatre', nom: 'Les petites choses' },
  { type: 'montage', dur: 16, coupes: [['coques', 'Coques.'], ['cables', 'Câbles.'], ['chargeur', 'Chargeurs.'], ['recharge-deux', 'Recharges.'],
    ['photocopieuse', 'Impressions.'], ['atelier-impression', 'Photocopies.'], ['passeports', 'Scans.'], ['classeurs', 'Reliures.']],
    st: [['Accessoires et bureautique, sur place.', 0.6, 15.6]] },
  { type: 'generique', dur: 30 },
  { type: 'fin', dur: 16 },
];

// ——— Petits outils ———
let graine = 11;
const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
const lignes = (mots, at, pas = .18) => mots.map((m, i) => `<span class="l" data-at="${at + i * pas}"><span>${m}</span></span>`).join('');
const sousTitres = st => (st || []).map(([t, a, f]) => `<div class="st" data-at="${a}" data-fin="${f}">${t}</div>`).join('');
const plan = (n, de, kb, fin) => `<div class="plan kb" data-kb="${kb || 'in'}" data-de="${de || 0}"${fin ? ` data-fin="${fin}"` : ''}><img src="${P(n)}" alt=""><div class="etalonnage"></div></div>`;
const LOGOS = ['western-union', 'moneygram', 'ria'].map(n => `<span class="${n}"><img src="assets/logos/${n}.png" alt=""></span>`);
const MARK = (noir) => `<img src="assets/mark-vert.png" alt=""${noir ? ' style="filter:brightness(0)"' : ''}><img src="assets/mark-blanc.png" alt=""${noir ? ' style="filter:brightness(0)"' : ''}>`;
const FISSURES = (() => {
  // éclats qui partent d'un point d'impact, avec quelques ramifications
  let d = '';
  const cx = 1000, cy = 400;
  for (let i = 0; i < 16; i++) {
    let a = i / 16 * Math.PI * 2 + hasard() * .3, x = cx, y = cy, l = 70 + hasard() * 60;
    d += `M${cx} ${cy}`;
    for (let k = 0; k < 5; k++) {
      a += (hasard() - .5) * .7; x += Math.cos(a) * l; y += Math.sin(a) * l * .8; l *= 1.05;
      d += ` L${x.toFixed(0)} ${y.toFixed(0)}`;
      if (k === 2 && hasard() > .4) { const b = a + (hasard() > .5 ? .9 : -.9); d += ` M${x.toFixed(0)} ${y.toFixed(0)} l${(Math.cos(b) * 120).toFixed(0)} ${(Math.sin(b) * 90).toFixed(0)} M${x.toFixed(0)} ${y.toFixed(0)}`; }
    }
  }
  let anneaux = '';
  for (const r of [26, 54]) {
    let p = '';
    for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2, rr = r * (.8 + hasard() * .4); p += `${i ? 'L' : 'M'}${(cx + Math.cos(a) * rr).toFixed(0)} ${(cy + Math.sin(a) * rr * .8).toFixed(0)} `; }
    anneaux += `<path d="${p}"/>`;
  }
  return `<svg class="fissures" viewBox="0 0 1920 818" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">
    <defs><clipPath id="CLIP"><path d="M560 120 L1560 160 L1500 700 L470 650 Z"/></clipPath></defs>
    <g clip-path="url(#CLIP)" fill="none" stroke="#f4f6f8" stroke-width="2.6" stroke-linecap="round" opacity=".92"><path pathLength="1" d="${d}"/>${anneaux}</g></svg>`;
})();

// ——— Fabrication des scènes ———
const FABRIQUE = {
  amorce: () => ({ id: 's-amorce', html: `<div class="cible"><div class="balai"></div><div class="rond"></div><div class="rond in"></div><div class="croix h"></div><div class="croix v"></div></div>
    <div class="chiffre"></div><div class="rayure" style="left:420px"></div><div class="rayure" style="left:1390px"></div>`, hook: 'amorce' }),
  lune: s => {
    let etoiles = '';
    for (let i = 0; i < 260; i++) etoiles += `<circle cx="${(hasard() * 1920).toFixed(0)}" cy="${(hasard() * 1080).toFixed(0)}" r="${(hasard() * 1.8 + .4).toFixed(1)}" fill="#fff" opacity="${(.3 + hasard() * .7).toFixed(2)}"/>`;
    return { hook: 'lune', html: `<div class="ecran plein" style="background:radial-gradient(ellipse at 62% 40%, #13213a 0%, #05070d 70%)">
      <svg viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:100%;height:100%">
        <defs><radialGradient id="gl" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf0"/><stop offset=".75" stop-color="#efe3c2"/><stop offset="1" stop-color="#d8c79d"/></radialGradient>
        <radialGradient id="halo"><stop offset=".55" stop-color="#fff6dc" stop-opacity=".35"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient></defs>
        ${etoiles}<circle cx="1180" cy="470" r="470" fill="url(#halo)"/><circle cx="1180" cy="470" r="280" fill="url(#gl)"/>
        <g fill="#cdbb8e" opacity=".35"><circle cx="1110" cy="400" r="42"/><circle cx="1260" cy="540" r="30"/><circle cx="1220" cy="360" r="18"/><circle cx="1090" cy="560" r="22"/></g>
      </svg>
      <div class="silhouette" style="position:absolute;left:0;top:0;width:170px;height:196px">${MARK(true)}</div>
      <div class="presente" data-at="5.6" data-fin="11.2">${s.texte}</div></div>` };
  },
  titre: s => ({ hook: 'titre', html: `<div class="titre-film"><h1>${s.titre}</h1><p data-at="3.2">${s.sous}</p></div>` }),
  chapitre: s => ({ hook: 'chapitre', html: `<div class="chapitre"><div class="num">${s.num}</div><div class="nom">${s.nom}</div><div class="trait"></div></div>` }),
  chute: () => ({ hook: 'chute', html: `<div class="ecran"><div class="plan kb" data-kb="lent"><img src="${P('iphone-noir')}" alt=""><div class="etalonnage"></div>${FISSURES}</div>
      ${plan('casse', 11.2, 'in')}<div class="flash" data-flash="6.0"></div></div>
      ${sousTitres([['Tout allait bien.', 1.0, 5.4], ['Jusqu’à ce matin-là.', 7.0, 10.8], ['Un écran en mille morceaux.', 11.8, 15.6]])}` }),
  rembobine: () => ({ hook: 'rembobine', html: `<div class="ecran"><div class="plan"><img src="${P('iphone-noir')}" alt=""><div class="etalonnage"></div>${FISSURES}</div>
      <div class="plan casse-r"><img src="${P('casse')}" alt=""><div class="etalonnage"></div></div>
      <div class="vhs"></div><div class="vhs-txt">◀◀ <span class="tc">00:00:00</span></div></div>
      ${sousTitres([['Et si on pouvait rembobiner ?', 0.6, 3.4], ['C’est exactement ce qu’on fait.', 8.2, 10.8]])}` }),
  photo: s => {
    const cls = s.serif ? 'mot serif' : s.moyen ? 'mot moyen' : 'mot';
    const mots = (s.mots || []).map(([m, a, f, empile]) =>
      `<div class="${cls}" ${empile ? 'style="bottom:-60px"' : ''} data-at="${a}" data-fin="${f}" data-fx="fade">${m}</div>`).join('');
    return { html: `<div class="ecran">${s.plans.map(([n, de, kb], i) => plan(n, de, kb, s.plans[i + 1] ? s.plans[i + 1][1] + 1 : 0)).join('')}
      <div class="ombre"></div>${mots}${s.plaques ? `<div class="plaques" data-at="${s.plaques}" data-fx="fade">${LOGOS.join('')}</div>` : ''}</div>${sousTitres(s.st)}` };
  },
  trajets: s => {
    const ici = [430, 520];
    const dest = [['Maroc', 1150, 610], ['Afrique', 1500, 690], ['Europe', 1240, 230], ['Ailleurs', 1700, 380]];
    let grille = '';
    for (let x = 40; x < 1920; x += 40) for (let y = 30; y < 818; y += 40) grille += `<circle cx="${x}" cy="${y}" r="1.6" fill="#3a4152"/>`;
    const arcs = dest.map(([nom, x, y], i) => {
      const mx = (ici[0] + x) / 2, my = Math.min(ici[1], y) - 230 - i * 20;
      return `<path class="arc" d="M${ici[0]} ${ici[1]} Q${mx} ${my} ${x} ${y}" stroke="#E9D7A6" stroke-width="3" fill="none" pathLength="1" opacity=".85"/>
        <circle class="pt" r="9" fill="#fff6da"/><g class="dest" opacity="0"><circle cx="${x}" cy="${y}" r="10" fill="#A5CD39"/><circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#A5CD39" stroke-width="2" opacity=".6"/>
        <text class="lieu" x="${x + 34}" y="${y + 12}">${nom}</text></g>`;
    }).join('');
    return { hook: 'trajets', html: `<div class="ecran" style="background:radial-gradient(ellipse at 40% 70%, #18202f 0%, #07080A 75%)">
      <svg viewBox="0 0 1920 818" style="position:absolute;inset:0;width:100%;height:100%">${grille}
        <circle cx="${ici[0]}" cy="${ici[1]}" r="60" fill="#A5CD39" opacity=".12"/><circle cx="${ici[0]}" cy="${ici[1]}" r="14" fill="#A5CD39"/>
        <text class="lieu" x="${ici[0] - 30}" y="${ici[1] + 70}" text-anchor="end">Ici, chez Helly-Co</text>${arcs}</svg></div>${sousTitres(s.st)}` };
  },
  envoi: s => ({ hook: 'envoi', html: `<div class="ecran">${plan('main-50', 0, 'in', 6.6)}
      <div class="moitie g" data-glisse="5.8"><img src="${P('dirhams')}" alt=""></div><div class="moitie d" data-glisse="6.2"><img src="${P('monde')}" alt=""></div>
      <div class="ombre"></div><div class="mot serif" data-at="0.8" data-fin="5.6" data-fx="fade">Envoyé.</div><div class="mot serif" data-at="7.0" data-fx="fade">Reçu.</div>
      <div class="plaques" data-at="1.4" data-fx="fade">${LOGOS.join('')}</div></div>${sousTitres(s.st)}` }),
  logos: s => ({ html: `<div class="ecran" style="background:radial-gradient(ellipse at 50% 40%, #1d2333 0%, #07080A 75%)"><div class="mur">
      <div class="serif" data-at="0.3" data-fx="fade">${s.titre}</div>
      <div class="rangee">${LOGOS.map((l, i) => l.replace('<span', `<span data-at="${0.8 + i * .4}" data-fx="fade"`)).join('')}</div></div></div>${sousTitres(s.st)}` }),
  entracte: () => ({ html: `<div class="ecran" style="background:radial-gradient(ellipse at 50% 45%, #3a1418 0%, #120507 80%)"><div class="centre">
      <div class="entracte" data-at="0.4" data-fx="fade">Entracte</div>
      <div class="horaires" data-at="1.8" data-fx="fade"><span>Lundi au jeudi, et samedi</span>9h30 à 19h00, sans interruption<span>Vendredi</span>9h30 à 13h00, puis 14h30 à 19h00</div></div></div>
      ${sousTitres([['La séance reprend dans un instant.', 2.6, 11.4]])}` }),
  papiers: s => {
    let f = '';
    for (let i = 0; i < 16; i++) f += `<g class="feuille"><rect x="-90" y="-120" width="180" height="240" rx="6" fill="#f3efe6"/>
      <path d="M-60 -80 H60 M-60 -50 H60 M-60 -20 H40 M-60 10 H60 M-60 40 H20" stroke="#9a9384" stroke-width="5"/></g>`;
    return { hook: 'papiers', html: `<div class="ecran" style="background:radial-gradient(ellipse at 60% 50%, #1f2230 0%, #07080A 75%)">
      <svg viewBox="0 0 1920 818" style="position:absolute;inset:0;width:100%;height:100%">${f}</svg>
      <div class="mot moyen" data-at="0.6" data-fin="2.4" data-fx="fade">Préfecture.</div><div class="mot moyen" data-at="2.4" data-fin="4.2" data-fx="fade">Consulats.</div>
      <div class="mot moyen" data-at="4.2" data-fin="6.0" data-fx="fade">Rendez-vous.</div><div class="mot moyen" data-at="6.0" data-fin="7.8" data-fx="fade">Formulaires.</div>
      <div class="mot serif" style="color:var(--vert)" data-at="8.6" data-fx="fade">En ordre.</div></div>${sousTitres(s.st)}` };
  },
  conseil: s => ({ html: `<div class="ecran">${plan('conseil', 0, 'in')}
      <div class="bulle g" style="left: 470px; top: 30px" data-at="1.2" data-fin="5.2">السلام عليكم</div>
      <div class="bulle d" style="right: 560px; top: 14px" data-at="2.6" data-fin="5.2">وعليكم السلام</div>
      <div class="bulle d" style="right: 430px; top: 14px" data-at="5.8">ما تخافش، غادي نعاونك</div></div>${sousTitres(s.st)}` }),
  langues: () => ({ html: `<div class="centre">
      <div class="langue" data-at="0.4" data-fx="fade">Bonjour.</div><div class="langue ar" dir="rtl" data-at="1.6" data-fx="fade">السلام عليكم</div>
      <div class="langue" data-at="2.8" data-fx="fade">Hello.</div><p class="petit" data-at="4.2" data-fx="fade">On vous répond en français, en arabe et en anglais.</p></div>` }),
  montage: s => ({ hook: 'montage', html: `<div class="ecran">${s.coupes.map(([n, m], i) =>
      `<div class="coupe" data-i="${i}">${plan(n, 0, i % 2 ? 'gauche' : 'droite')}<div class="ombre"></div><div class="mot">${m}</div></div>`).join('')}</div>${sousTitres(s.st)}` }),
  generique: () => ({ hook: 'generique', html: `<div class="ecran"><div class="defile">
      <div class="role">Helly-Co Services présente</div><div class="gros-titre" style="margin-top:20px">Un seul comptoir</div>
      <div class="role">Dans le rôle de la réparation de téléphone</div><div class="nom">Écran, batterie, prise de charge, caméra, haut-parleur, micro, vitre arrière</div>
      <div class="role">Dans le rôle du transfert d’argent</div><div class="logos-gen">${LOGOS.join('')}</div><div class="nom">Au Maroc et partout dans le monde, en espèces ou par carte</div>
      <div class="role">Dans le rôle des démarches administratives</div><div class="nom">Préfecture, consulats, rendez-vous, formulaires, dossiers</div>
      <div class="role">Dans le rôle des accessoires</div><div class="nom">Câbles, chargeurs, coques, protections, recharges</div>
      <div class="role">Dans le rôle de la bureautique</div><div class="nom">Impressions, photocopies, scans, reliures, plastifications</div>
      <div class="role">Langues parlées</div><div class="nom">Français, arabe, anglais</div>
      <div class="role">Horaires</div><div class="nom">Du lundi au jeudi et le samedi, de 9h30 à 19h00 sans interruption</div><div class="nom">Le vendredi, de 9h30 à 13h00, puis de 14h30 à 19h00</div>
      <div class="role" style="margin-top:110px">Un téléphone a été cassé pendant le tournage.</div><div class="nom">Il a été réparé.</div>
      <div style="height:120px"></div><div class="mark-gen">${MARK(false)}</div><img src="assets/texte-sur-fonce.png" alt="" style="width:340px;margin-top:20px">
    </div></div>` }),
  fin: () => ({ hook: 'fin', html: `<div class="ecran plein" style="background:radial-gradient(ellipse at 50% 42%, #13213a 0%, #05070d 72%)">
      <svg viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:100%;height:100%">
        <circle cx="960" cy="400" r="400" fill="url(#halo)"/><circle cx="960" cy="400" r="250" fill="url(#gl)"/></svg>
      <div class="centre fin" style="padding-bottom:280px"><div class="mark" data-at="0.4" data-fx="fade">${MARK(true)}</div></div>
      <div class="centre fin" style="justify-content:flex-end;padding-bottom:110px">
        <div class="titre-film" style="position:static"><h1 style="font-size:96px" data-at="2.6" data-fx="fade">Un seul comptoir</h1></div>
        <p class="petit" style="margin-top:18px" data-at="4.0" data-fx="fade">Helly-Co Services. Réparation, transfert d’argent, démarches, bureautique.</p></div></div>` }),
};

const conteneur = document.getElementById('scenes');
for (const s of LISTE) {
  const f = FABRIQUE[s.type](s);
  const el = document.createElement('section');
  el.className = 'scene';
  if (f.id) el.id = f.id;
  el.dataset.dur = s.dur;
  if (f.hook) el.dataset.hook = f.hook;
  el.innerHTML = f.html;
  conteneur.appendChild(el);
}

// ——— Moteur : une seule fonction render(t), déterministe ———
const stage = document.getElementById('stage');
const scenes = [...document.querySelectorAll('.scene')];
const FONDU = 0.5;
let total = 0;
for (const s of scenes) {
  s._debut = total; s._duree = parseFloat(s.dataset.dur);
  s._elems = [...s.querySelectorAll('[data-at]')];
  s._plans = [...s.querySelectorAll('.kb')];
  s._moities = [...s.querySelectorAll('.moitie')];
  s._ecran = s.querySelector('.ecran');
  total += s._duree;
}
const clamp = x => Math.min(1, Math.max(0, x));
const sortie = x => 1 - Math.pow(1 - clamp(x), 3);
const douce = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const KB = {
  in: p => `scale(${1.03 + .08 * p})`,
  out: p => `scale(${1.11 - .08 * p})`,
  gauche: p => `scale(1.1) translateX(${2.5 - 5 * p}%)`,
  droite: p => `scale(1.1) translateX(${-2.5 + 5 * p}%)`,
  lent: p => `scale(${1.0 + .05 * p})`,
};
const tremble = (s, lt, t0) => {
  const k = Math.max(0, 1 - (lt - t0) / .9);
  if (lt < t0 || k <= 0) { s._ecran.style.transform = ''; return; }
  s._ecran.style.transform = `translate(${Math.sin(lt * 90) * 22 * k}px, ${Math.cos(lt * 77) * 16 * k}px)`;
};

const hooks = {
  amorce(lt, s) {
    const n = Math.floor(lt / 1.6), f = (lt % 1.6) / 1.6;
    s.querySelector('.chiffre').textContent = n < 3 ? 3 - n : '';
    s.querySelector('.balai').style.background = n < 3 ? `conic-gradient(rgba(255,255,255,.28) ${f * 360}deg, rgba(0,0,0,0) 0)` : 'none';
    s.style.background = lt > 4.8 ? '#000' : '#262626';
    s.querySelector('.cible').style.opacity = lt > 4.8 ? 0 : 1;
    s.querySelectorAll('.rayure').forEach((r, i) => { r.style.opacity = (Math.floor(lt * 12) + i) % 3 ? .35 : 0; r.style.transform = `translateX(${Math.sin(lt * 13 + i) * 30}px)`; });
  },
  lune(lt, s) {
    const p = clamp((lt - 1.2) / 8.5);
    const x = lerp(160, 1820, p), y = 900 - Math.sin(p * Math.PI) * 460;
    s.querySelector('.silhouette').style.transform = `translate(${x - 85}px, ${y - 98}px) rotate(${(p - .5) * 10}deg)`;
  },
  titre(lt, s) {
    s.querySelector('h1').style.backgroundPosition = `${lerp(110, -10, clamp((lt - .3) / 4.5))}% 0`;
    s.querySelector('h1').style.opacity = sortie(lt / 1.2);
  },
  chapitre(lt, s) {
    s.querySelector('.num').style.opacity = sortie((lt - .3) / .8);
    s.querySelector('.nom').style.opacity = sortie((lt - .7) / 1.0);
    s.querySelector('.nom').style.letterSpacing = `${lerp(.12, 0, sortie((lt - .7) / 2.5))}em`;
    s.querySelector('.trait').style.transform = `scaleX(${douce((lt - 1.0) / 1.4)})`;
  },
  chute(lt, s) {
    const fis = s.querySelector('.fissures path[pathLength]');
    const p = lt < 6 ? 0 : sortie((lt - 6) / .35);
    fis.style.strokeDasharray = 1; fis.style.strokeDashoffset = 1 - p;
    s.querySelectorAll('.fissures g path:not([pathLength])').forEach(a => a.style.opacity = p);
    tremble(s, lt, 6.0);
  },
  rembobine(lt, s) {
    const r = clamp((lt - 3.4) / 4.4);               // avancement du rembobinage
    const casse = s.querySelector('.casse-r');
    casse.style.opacity = lt < 3.4 ? 1 : 1 - clamp((lt - 3.4) / .4);
    const fis = s.querySelector('.fissures path[pathLength]');
    fis.style.strokeDasharray = 1; fis.style.strokeDashoffset = douce(r);
    s.querySelectorAll('.fissures g path:not([pathLength])').forEach(a => a.style.opacity = 1 - clamp(r * 2));
    const actif = lt > 3.2 && lt < 8.0;
    s.querySelector('.vhs').style.opacity = actif ? .9 : 0;
    s.querySelector('.vhs-txt').style.opacity = actif ? (Math.floor(lt * 3) % 2 ? 1 : .55) : 0;
    const sec = Math.max(0, Math.round(lerp(6 * 3600 + 47 * 60, 6 * 3600, r) * 10) / 10);
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, se = Math.floor(sec) % 60;
    s.querySelector('.tc').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(se).padStart(2, '0')}`;
    s._ecran.style.transform = actif ? `translateX(${Math.sin(lt * 140) * 6}px) skewX(${Math.sin(lt * 37) * .8}deg)` : '';
    s._ecran.style.filter = actif ? 'contrast(1.2) saturate(.6)' : '';
    s.querySelector('.plan img').style.transform = lt > 7.8 ? `scale(${1 + .03 * clamp((lt - 7.8) / 3)})` : '';
  },
  trajets(lt, s) {
    const arcs = [...s.querySelectorAll('.arc')], pts = [...s.querySelectorAll('.pt')], dests = [...s.querySelectorAll('.dest')];
    arcs.forEach((a, i) => {
      const t0 = 1.2 + i * 1.6, p = douce((lt - t0) / 1.8);
      a.style.strokeDasharray = 1; a.style.strokeDashoffset = 1 - p;
      const L = a.getTotalLength(), q = ((lt - t0 - 1.8) / 2.4) % 1;
      const pt = a.getPointAtLength((lt > t0 + 1.8 ? q : p) * L);
      pts[i].setAttribute('cx', pt.x); pts[i].setAttribute('cy', pt.y); pts[i].setAttribute('opacity', p > 0 ? 1 : 0);
      dests[i].setAttribute('opacity', sortie((lt - t0 - 1.6) / .5));
    });
  },
  envoi(lt, s) {
    s._moities.forEach(m => {
      const g = douce((lt - parseFloat(m.dataset.glisse)) / .9), gauche = m.classList.contains('g');
      m.style.transform = `translateY(${(gauche ? -1 : 1) * (1 - g) * 100}%)`;
      m.style.visibility = g > 0 ? 'visible' : 'hidden';
      m.firstElementChild.style.transform = `scale(${1.03 + .05 * clamp((lt - 6) / 6)})`;
    });
  },
  papiers(lt, s) {
    graine = 5;
    [...s.querySelectorAll('.feuille')].forEach((f, i) => {
      const a0 = hasard() * 6.28, r = 180 + hasard() * 260, v = .5 + hasard() * .7, ro = hasard() * 360;
      const a = a0 + lt * v;
      const cx = 1250 + Math.cos(a) * r * 1.4, cy = 409 + Math.sin(a) * r * .7, rc = ro + lt * 60 * v;
      const p = douce((lt - 7.6 - i * .05) / 1.4);
      const x = lerp(cx, 1350, p), y = lerp(cy, 560 - i * 7, p), rot = lerp(rc, (i % 2 ? -2 : 2), p);
      f.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) scale(${lerp(.75 + (i % 3) * .1, 1, p)})`);
    });
  },
  montage(lt, s) {
    const coupes = [...s.querySelectorAll('.coupe')], d = (s._duree - .4) / coupes.length;
    const i = Math.min(coupes.length - 1, Math.floor(lt / d));
    coupes.forEach((c, k) => {
      c.style.visibility = k === i ? 'visible' : 'hidden';
      if (k !== i) return;
      const p = (lt - k * d) / d;
      c.querySelector('.plan').style.transform = (k % 2 ? KB.gauche : KB.droite)(p);
      const m = c.querySelector('.mot');
      m.style.opacity = sortie(p / .2);
      m.style.transform = `translateY(${(1 - sortie(p / .25)) * 40}px)`;
    });
    tremble(s, lt % d, 0);
  },
  generique(lt, s) {
    const d = s.querySelector('.defile'), h = d.offsetHeight;
    d.style.transform = `translateY(${lerp(818, -h + 520, clamp(lt / (s._duree - 1.5)))}px)`;
  },
  fin(lt, s) {},
};

// ——— Grain de pellicule et lumière parasite ———
const grain = document.getElementById('grain').getContext('2d');
const tuiles = Array.from({ length: 6 }, () => {
  const img = grain.createImageData(480, 270);
  for (let i = 0; i < img.data.length; i += 4) { const v = hasard() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  return img;
});
const fuite = document.getElementById('fuite');
const coin = document.getElementById('coin');

function render(t) {
  t = ((t % total) + total) % total;
  grain.putImageData(tuiles[Math.floor(t * 24) % tuiles.length], 0, 0);
  for (const [i, s] of scenes.entries()) {
    const lt = t - s._debut;
    const actif = lt >= 0 && lt < s._duree;
    s.style.visibility = actif ? 'visible' : 'hidden';
    if (!actif) continue;
    s.style.opacity = Math.min(1, lt / FONDU, (s._duree - lt) / FONDU);
    // un voile de lumière chaude traverse l'image au début de chaque scène
    const lf = clamp(1 - lt / 1.6);
    fuite.style.opacity = .55 * lf * lf;
    fuite.style.background = `radial-gradient(ellipse at ${i % 2 ? 85 : 15}% ${30 + (i * 17) % 40}%, rgba(255,140,40,.8) 0%, rgba(255,80,20,.25) 30%, rgba(0,0,0,0) 60%)`;
    coin.style.visibility = ['amorce', 'lune', 'fin', 'generique'].includes(s.dataset.hook) ? 'hidden' : 'visible';
    for (const e of s._elems) {
      const at = parseFloat(e.dataset.at);
      const fin = e.dataset.fin ? 1 - sortie((lt - parseFloat(e.dataset.fin)) / .5) : 1;
      if (e.classList.contains('l')) e.firstElementChild.style.transform = `translateY(${(1 - sortie((lt - at) / .8)) * 110}%)`;
      else e.style.opacity = Math.min(sortie((lt - at) / .7), fin);
    }
    for (const pl of s._plans) {
      const de = parseFloat(pl.dataset.de || 0), fi = pl.dataset.fin ? parseFloat(pl.dataset.fin) : s._duree;
      const p = clamp((lt - de) / (s._duree - de));
      pl.style.opacity = de ? sortie((lt - de) / .8) : 1;
      pl.style.visibility = lt >= de && lt <= fi ? 'visible' : 'hidden';
      pl.style.transform = (KB[pl.dataset.kb] || KB.in)(p);
    }
    for (const fl of s.querySelectorAll('[data-flash]')) {
      const d = lt - parseFloat(fl.dataset.flash);
      fl.style.opacity = d < 0 ? 0 : Math.max(0, 1 - d / .5);
    }
    if (s.dataset.hook) hooks[s.dataset.hook](lt, s);
  }
}

function ajuster() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', ajuster);
ajuster();
window.__render = render;
window.__total = total;
if (!location.search.includes('export')) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const boucle = now => { render((now - t0) / 1000); requestAnimationFrame(boucle); };
    requestAnimationFrame(boucle);
  });
} else {
  render(0);
}
</script>
</body>
</html>
